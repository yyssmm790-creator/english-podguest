[build]
  command = "npm run build"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/story"
  to = "/.netlify/functions/story"
  status = 200
  force = true

[[redirects]]
  from = "/api/speech"
  to = "/.netlify/functions/speech"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice-status"
  to = "/.netlify/functions/voice-status"
  status = 200
  force = true
